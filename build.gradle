import org.gradle.internal.jvm.Jvm
import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

plugins {
    id 'cpp-library'
    id 'java'
    id 'application'
}

def steamworksSdkCommit = 'df2baabf574a738ef1ea90a7e89339107fc0a279'
def steamworksSdkUrl = 'https://github.com/rlabrecque/SteamworksSDK.git' // v1.65 (a)
def steamworksSdkDir = layout.buildDirectory.dir('steamworks-sdk')

group = 'net.bdew.wurmsteam'
version = '1.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

library {
    linkage = [Linkage.SHARED]
    baseName = 'SteamServerJni'
}

application {
    mainClass = 'net.bdew.test.TestSteamAPI'
    applicationDefaultJvmArgs = ["-Djava.library.path=${layout.buildDirectory.dir('lib/main/debug').get().asFile}"]
}

dependencies {

}

tasks.named('run').configure {
    dependsOn(tasks.named('assembleDebug'))
}

tasks.register('cloneSteamworksSdk') {
    group = 'Build'
    description = 'Clones the pinned Steamworks SDK revision into the build directory.'
    inputs.property('commit', steamworksSdkCommit)
    outputs.dir(steamworksSdkDir)

    doLast {
        def sdkDirectory = steamworksSdkDir.get().asFile
        if (!new File(sdkDirectory, '.git').exists()) {
            exec {
                commandLine 'git', 'clone', '--no-checkout', steamworksSdkUrl, sdkDirectory
            }
        } else {
            exec {
                commandLine 'git', '-C', sdkDirectory, 'fetch', 'origin', steamworksSdkCommit
            }
        }
        exec {
            commandLine 'git', '-C', sdkDirectory, 'checkout', '--detach', steamworksSdkCommit
        }
    }
}

def os = DefaultNativePlatform.currentOperatingSystem

tasks.withType(CppCompile).configureEach { cppCompile ->
    def javaHome = Jvm.current().javaHome
    def platformInclude = os.isWindows() ? "win32" : os.isMacOsX() ? "darwin" : "linux"
    compilerArgs.addAll([
            "-I${javaHome}/include",
            "-I${javaHome}/include/${platformInclude}",
            "-I${steamworksSdkDir.get().asFile}/public",
            "-I${steamworksSdkDir.get().asFile}/public/steam"
    ])
    cppCompile.dependsOn(tasks.compileJava)
    cppCompile.dependsOn(tasks.named('cloneSteamworksSdk'))
}

def isArm64 = DefaultNativePlatform.currentArchitecture.isArm64()
def steamLibDir = os.isWindows() ? 'redistributable_bin/win64' : os.isMacOsX() ? 'redistributable_bin/osx' : isArm64 ? 'redistributable_bin/linuxarm64' : 'redistributable_bin/linux64'
def steamLibName = os.isWindows() ? 'steam_api64' : 'steam_api'

tasks.withType(LinkSharedLibrary).configureEach { link ->
    def libDir = new File(steamworksSdkDir.get().asFile, steamLibDir)
    linkerArgs.addAll(["-L${libDir}", "-l${steamLibName}"])
    if (!os.isWindows()) {
        linkerArgs.add("-Wl,-rpath,${libDir}")
        linkerArgs.add("-Wl,-rpath,\$ORIGIN")
    }
    link.dependsOn(tasks.named('cloneSteamworksSdk'))
}

tasks.named("compileJava").configure {
    // Specifies where the generated .h files should be placed
    options.headerOutputDirectory = file("src/main/headers")
}